
name: Build Lumo Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Lumo_Android_Full_Project.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Lumo Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Get repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Set up Android SDK without automatic licence prompts
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''

      # 4. Accept SDK licences automatically
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses

      # 5. Install required Android SDK packages
      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 6. Install Gradle
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 7. Extract the complete project ZIP
      - name: Extract Lumo Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Lumo_Android_Full_Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Lumo project ZIP not found!"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/lumo-unpacked"

          unzip -q "$ZIP_FILE" \
            -d "$RUNNER_TEMP/lumo-unpacked"

          echo "Searching for Android project..."

          PROJECT_DIR="$(find "$RUNNER_TEMP/lumo-unpacked" \
            -type f -name settings.gradle.kts \
            -printf '%h\n' -quit)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts not found!"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts not found!"
            exit 1
          fi

          echo "LUMO_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$PROJECT_DIR"

      # 8. Build Android debug APK
      - name: Build Lumo APK
        working-directory: ${{ env.LUMO_PROJECT_DIR }}
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # 9. Verify APK exists
      - name: Verify APK
        shell: bash
        run: |
          APK="${LUMO_PROJECT_DIR}/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          ls -lh "$APK"

      # 10. Upload APK to GitHub Actions
      - name: Upload Lumo APK
        uses: actions/upload-artifact@v4
        with:
          name: Lumo-debug-APK
          path: ${{ env.LUMO_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
