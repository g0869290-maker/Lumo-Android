
name: Build Lumo Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Lumo_Android_Full_Project.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Lumo Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Configure Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ''

      # 4. Install Android SDK packages
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Extract project ZIP
      - name: Extract Lumo Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Lumo_Android_Full_Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found!"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/lumo-project"

          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/lumo-project"

          PROJECT_DIR="$(find "$RUNNER_TEMP/lumo-project" \
            -type f \( \
              -name settings.gradle.kts -o \
              -name settings.gradle \
            \) -printf '%h\n' -quit)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found in ZIP!"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: App Gradle file not found!"
            exit 1
          fi

          echo "LUMO_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found project: $PROJECT_DIR"

      # 6. Install Gradle
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 7. Create Java 17 compatibility fix
      - name: Configure Java and Kotlin JVM targets
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/lumo-jvm17.init.gradle" <<'EOF'
          gradle.projectsEvaluated {
              allprojects {
                  tasks.withType(
                      org.gradle.api.tasks.compile.JavaCompile
                  ).configureEach {
                      sourceCompatibility = '17'
                      targetCompatibility = '17'
                  }
              }
          }
          EOF

          echo "Java compilation target set to JVM 17."

      # 8. Build Android APK
      - name: Build Lumo Debug APK
        working-directory: ${{ env.LUMO_PROJECT_DIR }}
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            --init-script "$RUNNER_TEMP/lumo-jvm17.init.gradle" \
            assembleDebug

      # 9. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="${LUMO_PROJECT_DIR}/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      # 10. Upload APK
      - name: Upload Lumo APK
        uses: actions/upload-artifact@v4
        with:
          name: Lumo-debug-APK
          path: ${{ env.LUMO_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
