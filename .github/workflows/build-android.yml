name: Build Lumo Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'Lumo_Android_Project_For_GitHub.zip'
      - '.github/workflows/build-lumo.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Lumo APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK path is not configured."
            exit 1
          fi

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Lumo_Android_Project_For_GitHub.zip"
          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP is missing from the repository root."
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          SETTINGS="$(find extracted -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$SETTINGS" ]; then
            SETTINGS="$(find extracted -type f -name settings.gradle -print -quit)"
          fi
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file was not found inside the ZIP."
            find extracted -maxdepth 5 -type f | sort | head -n 100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: Android app module was not found in $PROJECT_DIR"
            exit 1
          fi

          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Validate bundled HTML and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          test -s "$ANDROID_PROJECT_DIR/app/src/main/assets/index.html"
          test -s "$ANDROID_PROJECT_DIR/app/src/main/assets/app.js"
          node --check "$ANDROID_PROJECT_DIR/app/src/main/assets/app.js"
          echo "Bundled UI assets are present and JavaScript syntax is valid."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT_DIR"
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$ANDROID_PROJECT_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK was not generated."
            find "$ANDROID_PROJECT_DIR/app/build/outputs" -maxdepth 6 -type f 2>/dev/null || true
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/Lumo-Android-debug.apk
          ls -lh output/Lumo-Android-debug.apk

      - name: Upload Lumo APK
        uses: actions/upload-artifact@v4
        with:
          name: Lumo-Android-debug-APK
          path: output/Lumo-Android-debug.apk
          if-no-files-found: error
          retention-days: 14
