
name: Build Lumo Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Lumo_Android_Full_Project.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Lumo Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Android SDK and automatically accept licences
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ''

      # 4. Install Android build packages
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Extract project ZIP
      - name: Extract Lumo Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Lumo_Android_Full_Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP missing from repository root."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/lumo-project"

          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/lumo-project"

          echo "ZIP contents:"
          find "$RUNNER_TEMP/lumo-project" -maxdepth 3 -type f | head -100

          PROJECT_DIR="$(find "$RUNNER_TEMP/lumo-project" \
            -type f \( \
              -name settings.gradle.kts -o \
              -name settings.gradle \
            \) -printf '%h\n' -quit)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: Android app Gradle file not found."
            exit 1
          fi

          echo "LUMO_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

      # 6. Install Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 7. Build APK
      - name: Build Lumo Debug APK
        working-directory: ${{ env.LUMO_PROJECT_DIR }}
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # 8. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="${LUMO_PROJECT_DIR}/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      # 9. Upload APK
      - name: Upload Lumo APK
        uses: actions/upload-artifact@v4
        with:
          name: Lumo-debug-APK
          path: ${{ env.LUMO_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
