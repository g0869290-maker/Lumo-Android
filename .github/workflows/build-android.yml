
name: Build Lumo Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Lumo APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Check and extract ZIP
        run: |
          if [ ! -f "Lumo_Android_Native_Project.zip" ]; then
            echo "ERROR: Lumo_Android_Native_Project.zip not found in repository root."
            exit 1
          fi

          mkdir -p extracted
          unzip -q Lumo_Android_Native_Project.zip -d extracted

      - name: Locate Android project
        run: |
          SETTINGS=$(find extracted -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Android app module not found."
            find "$PROJECT_DIR" -maxdepth 4 -type f
            exit 1
          fi

          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Build Lumo APK
        run: |
          cd "$ANDROID_PROJECT_DIR"
          gradle --no-daemon clean assembleDebug

      - name: Find APK
        run: |
          APK=$(find "$ANDROID_PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/*/*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/Lumo-Android-debug.apk"

      - name: Upload Lumo APK
        uses: actions/upload-artifact@v4
        with:
          name: Lumo-Android-debug-APK
          path: output/Lumo-Android-debug.apk
          if-no-files-found: error
          retention-days: 14
