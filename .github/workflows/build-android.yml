name: Build Lumo Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Lumo APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -path '*/cmdline-tools/*/bin/sdkmanager' | head -n 1)
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android project
        run: |
          if [ -f "Lumo_Android_Native_Project.zip" ]; then
            rm -rf extracted && mkdir -p extracted
            unzip -q Lumo_Android_Native_Project.zip -d extracted
            ROOT="extracted"
          else
            ROOT="."
          fi
          SETTINGS=$(find "$ROOT" -path '*/.git' -prune -o -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) not found. Put Lumo_Android_Native_Project.zip in the repository root."
            find "$ROOT" -maxdepth 3 -type f | head -n 50
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app module not found in $PROJECT_DIR"
            exit 1
          fi
          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Build debug APK
        run: |
          cd "$ANDROID_PROJECT_DIR"
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Collect APK
        run: |
          APK=$(find "$ANDROID_PROJECT_DIR" -type f -path "*/build/outputs/apk/*/*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/Lumo-Android-debug.apk"

      - name: Upload Lumo APK
        uses: actions/upload-artifact@v4
        with:
          name: Lumo-Android-debug-APK
          path: output/Lumo-Android-debug.apk
          if-no-files-found: error
          retention-days: 14
