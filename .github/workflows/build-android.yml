
name: Build Lumo Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Lumo_Android_Full_Project.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Lumo Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Lumo Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Lumo_Android_Full_Project.zip"

          test -f "$ZIP_FILE" || {
            echo "Project ZIP not found!"
            exit 1
          }

          mkdir -p "$RUNNER_TEMP/lumo-unpacked"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/lumo-unpacked"

          PROJECT_DIR="$(find "$RUNNER_TEMP/lumo-unpacked" \
            -type f -name settings.gradle.kts \
            -printf '%h\n' -quit)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle project not found!"
            exit 1
          fi

          test -f "$PROJECT_DIR/app/build.gradle.kts"

          echo "LUMO_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Lumo APK
        working-directory: ${{ env.LUMO_PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lumo-debug-APK
          path: ${{ env.LUMO_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
